# Мир, в который телепортирует
world: grief-1

near:
  min-distance: 60
  max-distance: 180
  cooldown-seconds: 900

base:
  min-distance: 50
  max-distance: 120
  cooldown-seconds: 900
  # Учитывать только игроков, заходивших за последние N дней
  active-days: 30
  # Сколько оффлайн-игроков максимум проверять за одну команду (защита от лагов)
  max-checked-players: 40

heal:
  cooldown-seconds: 60

feed:
  cooldown-seconds: 30

back:
  cooldown-seconds: 300
  # Миры, в которых работает /back (и запоминаются места смерти / телепортации)
  worlds:
    - world
    - grief-1
    - grief-1_nether
    - grief-1_the_end

# Оформление ника после префикса из /prefix и /uprefix (белый жирный).
# Цвет пишется ПЕРЕД жирным: &f&l (а &l&f сбросит жирность). Пустая строка — не менять ник.
name-style: "&f&l"

# /uprefix — префикс в табе и над головой (плагин TAB)
uprefix:
  # Максимум символов префикса без учёта цветовых кодов
  max-length: 16
  # Что добавлять после префикса (пробел между префиксом и ником)
  suffix: " "
  # Какие свойства TAB менять: tabprefix — таб, tagprefix — над головой
  properties:
    - tabprefix
    - tagprefix

# /prefix — префикс только в чате (нужен чат, который берёт префикс из TAB: chatprefix)
prefix:
  max-length: 16
  suffix: " "
  properties:
    - chatprefix

# /player on|off — скрывает донат/префикс, показывает жирное "Игрок"
player:
  text: "&f&lИгрок"
  suffix: " &r"
  properties:
    - tabprefix
    - tagprefix
    - chatprefix

# Сколько попыток найти безопасную точку
attempts: 20

